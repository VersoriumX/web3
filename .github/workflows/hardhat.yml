name: Hardhat CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '14.5.0,lts*'  # Specify your Node.js version

      - name: Install dependencies
        run: npm install

      - name: Run Hardhat tests
        run: npx hardhat test

      - name: Run Hardhat linting
        run: npx hardhat lint  # Adjust this if you have a specific linting command
